<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration — {{ school_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #1D4ED8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .reg-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 520px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="reg-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 56px; height: 56px; background: #2563EB; color: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 12px auto;">
                <i class="fas fa-user-graduate"></i>
            </div>
            <h2 style="font-size: 1.5rem; color: #0F172A;">Create Student Account</h2>
            <p style="color: #64748B; font-size: 0.85rem;">XYZ School and College Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; {% if category == 'danger' %}background: #FEE2E2; color: #991B1B;{% else %}background: #DCFCE7; color: #166534;{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" required class="form-control" placeholder="Choose username">
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="full_name" required class="form-control" placeholder="e.g. Aayush Maharjan">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" required class="form-control" placeholder="student@example.com">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Student ID (Optional)</label>
                    <input type="text" name="student_id" class="form-control" placeholder="KSS-2081-001">
                </div>
                <div class="form-group">
                    <label class="form-label">Grade / Class</label>
                    <input type="text" name="grade_class" class="form-control" placeholder="Class 10-A">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" required class="form-control" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirm_password" required class="form-control" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px; background: #2563EB;"><i class="fas fa-user-plus"></i> Complete Registration</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.85rem;">
            <p style="color: #64748B;">Already have an account? <a href="{{ url_for('auth.login') }}" style="color: #2563EB; font-weight: 700;">Login here</a></p>
        </div>
    </div>
</body>
</html>
